# Fichier : .gemini/commands/test/gen.toml
# Appel : /test:gen <nom_du_fichier>
description = "Génère des tests unitaires Vitest pour le fichier spécifié."

prompt = """
## ROLE
Expert en tests unitaires avec Vitest et Testing Library (React Testing Library pour les composants, Vitest pour la logique métier).

## CONTEXTE
Tu travailles sur HASHCODE — une application Next.js 15 App Router. Les tests utilisent Vitest. Les composants React sont testés avec React Testing Library (render, screen, userEvent). Les tests sont dans `__tests__/` ou aux côtés des fichiers testés avec l'extension `.test.ts` ou `.test.tsx`. Consulte `vitest.config.ts` pour la configuration exacte.

## OBJECTIVE
Générer une suite de tests unitaires complète couvrant les cas nominaux, les cas d'erreur, et les cas limites du fichier fourni.

## INPUTS
- Fichier cible : {{args}}
- Contenu du fichier : @{ {{args}} }
- Conventions du projet : Vitest config, Testing Library, structure des tests existante dans `__tests__/`

## TASKS
1. Analyser le fichier source pour identifier les exports, fonctions, composants, hooks.
2. Lister les cas nominaux (happy path) pour chaque export.
3. Lister les cas d'erreur (exceptions, valeurs invalides, états vides).
4. Lister les cas limites (bords d'intervalle, valeurs nulles/undefined, types inattendus).
5. Générer les tests avec describe/it, mocks appropriés, et assertions pertinentes.
6. Vérifier la couverture des imports (ne pas tester du code externe/librairie).

## METHODOLOGY
1. Lire le fichier cible et identifier les exports.
2. Pour chaque export :
   - Composant React : tester le rendu, les props, les interactions utilisateur, les états vides/charge/erreur.
   - Fonction utilitaire : tester l'entrée/sortie, les cas d'erreur, les edge cases.
   - Hook : tester l'état initial, les mises à jour, les effets de bord.
3. Utiliser `vi.mock()` pour les dépendances externes (Prisma, fetch, auth).
4. Structurer avec describe/imites/logique/assertions.

## DELIVERABLES
- Code de test complet, prêt à être copié dans le fichier de test correspondant.

## FORMAT
```typescript
import { describe, it, expect, vi, beforeEach } from "vitest"

// Imports nécessaires
import { maFonction } from "@/lib/mon-fichier"

describe("maFonction", () => {
  beforeEach(() => {
    vi.clearAllMocks()
  })

  it("cas nominal", () => {
    // arrange
    // act
    // assert
  })

  it("cas d'erreur", () => {
    // ...
  })
})
```

## QUALITY GATES
- Chaque export testé (pas de fonction publique non testée).
- Au moins 1 test nominal + 1 test d'erreur par export.
- Tests isolés (mocks pour DB, réseau, auth).
- Pas de test redondant ou trivial.
- Utilisation de `userEvent` (pas `fireEvent`) pour les interactions React.

## VERIFICATION
- [ ] Tous les exports publics sont-ils testés ?
- [ ] Les cas d'erreur sont-ils couverts (pas seulement le happy path) ?
- [ ] Les mocks isolent-ils correctement les dépendances ?
- [ ] Le code est-il prêt à l'emploi (imports corrects, vi.mock en place) ?
- [ ] Aucune donnée réelle ou sensible dans les tests ?
"""
