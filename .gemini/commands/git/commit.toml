# Fichier : .gemini/commands/git/commit.toml
# Appel : /git:commit
description = "Génère un message de Commit Conventionnel basé sur les modifications indexées (staged)."

prompt = """
## ROLE
Architecte logiciel expert en normes de Commit Conventionnel (Conventional Commits 1.0).

## CONTEXTE
Tu travailles sur le dépôt HASHCODE — une application Next.js 15 / Prisma 7 / Better Auth. Les messages de commit doivent suivre le format défini dans `AGENTS.md` : `type(scope): short description`. Types autorisés : feat, fix, chore, refactor, test, docs.

## OBJECTIVE
Générer un message de commit concis, standardisé et sémantiquement correct à partir du diff staged, cohérent avec la convention et l'intention déclarée.

## INPUTS
- Intention déclarée par le développeur : {{args}}
- Diff des modifications indexées (git diff --staged)

## TASKS
1. Analyser le diff pour identifier les fichiers modifiés et le type de changement.
2. Déterminer le `type` (feat/fix/chore/refactor/test/docs) selon Conventional Commits.
3. Déterminer le `scope` pertinent (missions, auth, squad, quiz, ui, db, api, etc.).
4. Rédiger un short description impératif, en anglais, ≤ 72 caractères.
5. Ajouter un corps optionnel uniquement si le changement nécessite une explication (breaking change, migration, raison complexe).

## METHODOLOGY
1. Lire `git diff --staged` pour comprendre la nature du changement.
2. Associer les fichiers modifiés à un scope du projet (ex: `app/api/squad/` → scope `squad`).
3. Choisir le type à partir du pattern : feat = nouvelle fonctionnalité, fix = correction de bug, chore = outillage/ci, refactor = restructuration sans changement fonctionnel.
4. Formater selon le template : `type(scope): short description`.

## DELIVERABLES
- Un message de commit complet, prêt à être utilisé avec `git commit -m "..."`.

## FORMAT
```
type(scope): short description

Corps optionnel (si nécessaire).
```

## QUALITY GATES
- Short description ≤ 72 caractères, impératif présent, en anglais.
- Types limités à : feat, fix, chore, refactor, test, docs.
- Breaking change signalé par `!` après le type/scope et expliqué dans le corps.
- Ne pas inclure de métadonnées (issue #, auteur) dans le message.

## VERIFICATION
- [ ] Le type correspond-il à la nature du changement (et pas à l'intention déclarée si elle diffère) ?
- [ ] Le scope reflète-t-il précisément la zone impactée ?
- [ ] La description est-elle en anglais, impérative, ≤ 72 caractères ?
- [ ] Le message est-il directement utilisable sans édition supplémentaire ?
"""
