version: 2
updates:
  # Dépendances npm/pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Abidjan"
    open-pull-requests-limit: 10
    groups:
      # Grouper les mises à jour mineures/patch par domaine pour réduire le bruit
      next-ecosystem:
        patterns: ["next", "react", "react-dom", "@types/react*"]
        update-types: ["minor", "patch"]
      radix-ui:
        patterns: ["@radix-ui/*"]
        update-types: ["minor", "patch"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
        update-types: ["minor", "patch"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: ["minor", "patch"]
      dev-tools:
        patterns: ["eslint*", "typescript", "vitest", "@types/*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Abidjan"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
