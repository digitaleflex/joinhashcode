name: "⚡ HASHCODE DevSecOps Pipeline"

# ──────────────────────────────────────────────────────────────
# Un seul workflow. Chaque job ne démarre que si le précédent réussit.
# Visualisation dans GitHub Actions :
#
#   lint-security ─→ test ─→ build ─→ deploy ─→ database ─→ verify ─→ report
#
# ──────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"

jobs:
  # ═══════════════════════════════════════════════════════════
  # BLOC 1 : LINT & SÉCURITÉ
  # Analyse statique, audit des dépendances, secrets leak check
  # ═══════════════════════════════════════════════════════════
  lint-security:
    name: "🔒 Lint & Sécurité"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "🔍 ESLint — Analyse statique du code"
        run: pnpm run lint || echo "::warning::Lint warnings detected"

      - name: "🛡️ Audit npm — Vulnérabilités connues (CVE)"
        run: pnpm audit --audit-level=critical || echo "::warning::Non-critical vulnerabilities found"

      - name: "🔐 Secrets Scan — Détection de fuites"
        run: |
          echo "Scanning for hardcoded secrets..."
          # Patterns dangereux dans le code source
          FOUND=0
          for PATTERN in "AKIA[0-9A-Z]{16}" "sk_live_" "ghp_[a-zA-Z0-9]{36}" "-----BEGIN.*PRIVATE KEY-----"; do
            if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
               -E "$PATTERN" . --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git 2>/dev/null; then
              echo "::error::Potential secret found matching pattern: $PATTERN"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Hardcoded secrets detected! Fix before merging."
            exit 1
          fi
          echo "✓ No hardcoded secrets found"

      - name: "📦 Prisma Schema — Validation"
        run: |
          export DATABASE_URL="postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public"
          export DIRECT_URL="postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public"
          pnpm prisma validate

  # ═══════════════════════════════════════════════════════════
  # BLOC 2 : TESTS
  # Tests unitaires + intégration avec PostgreSQL éphémère
  # ═══════════════════════════════════════════════════════════
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: [lint-security]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: hashcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set test environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public" >> $GITHUB_ENV
          echo "DIRECT_URL=postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET || 'ci_test_secret_32chars_placeholder' }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "QSTASH_TOKEN=dummy_ci_token" >> $GITHUB_ENV

      - name: "⚙️ Prisma Generate"
        run: pnpm prisma generate

      - name: "🗄️ Prisma DB Push (test DB)"
        run: pnpm prisma db push

      - name: "🧪 Vitest — Suite de tests"
        run: pnpm run test run

  # ═══════════════════════════════════════════════════════════
  # BLOC 3 : BUILD & PUSH DOCKER
  # Construction de l'image et publication sur ghcr.io
  # Uniquement sur push (pas sur PR)
  # ═══════════════════════════════════════════════════════════
  build:
    name: "🐳 Build Docker"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      full-image: ${{ steps.image-ref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: "🏗️ Build and Push"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image reference
        id: image-ref
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "ref=ghcr.io/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════
  # BLOC 4 : DÉPLOIEMENT VPS
  # Pull de l'image + démarrage du conteneur sur le serveur
  # Uniquement sur la branche main
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Déploiement VPS"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    outputs:
      previous-image: ${{ steps.ssh-deploy.outputs.previous_image }}

    steps:
      - name: Deploy container via SSH
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.SSH_PATH }}"
            BACKUP="/tmp/.env.production.bak"
            SHA="${{ github.sha }}"
            SHORT_SHA="${SHA:0:7}"
            IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  [DEPLOY] Image : ${IMAGE}"
            echo "  [DEPLOY] Date  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Capturer l'image actuelle pour rollback
            PREVIOUS_IMAGE=""
            if docker compose ps web --format '{{.Image}}' 2>/dev/null | head -1 | grep -q '.'; then
              PREVIOUS_IMAGE=$(docker compose ps web --format '{{.Image}}' 2>/dev/null | head -1)
              echo "previous_image=${PREVIOUS_IMAGE}" >> /tmp/deploy_outputs
              echo "[INFO] Image précédente : ${PREVIOUS_IMAGE}"
            fi

            # Sauvegarde .env.production
            if [ -f ".env.production" ]; then
              cp .env.production "$BACKUP"
            fi

            # Git pull
            if [ ! -d ".git" ]; then
              find . -mindepth 1 -delete
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/digitaleflex/joinhashcode.git .
            else
              git reset --hard
              git pull origin main
            fi

            # Restaurer .env.production
            if [ -f "$BACKUP" ]; then
              cp "$BACKUP" .env.production
              rm -f "$BACKUP"
            fi

            if [ ! -f ".env.production" ]; then
              echo "::error::ERREUR CRITIQUE : .env.production introuvable"
              exit 1
            fi

            # Pull + démarrage
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            HASHCODE_IMAGE="$IMAGE" docker compose pull web
            HASHCODE_IMAGE="$IMAGE" docker compose up -d --no-deps web

            echo "[DEPLOY] Conteneur démarré ✓"

  # ═══════════════════════════════════════════════════════════
  # BLOC 5 : OPÉRATIONS BASE DE DONNÉES
  # Dédup + Schema push + Migration + Seed
  # Chaque étape est isolée avec gestion d'erreur individuelle
  # ═══════════════════════════════════════════════════════════
  database:
    name: "🗄️ Base de données"
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: "Attendre le démarrage du conteneur"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ${{ secrets.SSH_PATH }}

            echo "[DB] Attente du conteneur (max 60s)..."
            RETRIES=0
            until docker compose exec -T web sh -c "wget -qO- http://localhost:3000/api/status" 2>/dev/null | grep -q "ok"; do
              RETRIES=$((RETRIES + 1))
              if [ "$RETRIES" -ge 12 ]; then
                echo "::error::Le conteneur ne répond pas après 60s"
                docker compose logs --tail=30 web
                exit 1
              fi
              sleep 5
            done
            echo "[DB] Conteneur prêt ✓"

      - name: "Déduplication des contraintes"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            cd ${{ secrets.SSH_PATH }}
            echo "[DB] Nettoyage des doublons..."
            if docker compose exec -T web npx tsx scripts/dedup-constraints.ts; then
              echo "[DB] Déduplication OK ✓"
            else
              echo "::warning::Déduplication échouée (non bloquant)"
            fi

      - name: "Prisma DB Push (schéma)"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            cd ${{ secrets.SSH_PATH }}
            echo "[DB] Application du schéma Prisma..."
            docker compose exec -T web npx prisma db push
            echo "[DB] Schéma appliqué ✓"

      - name: "Migration Guilds → Organizations"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            cd ${{ secrets.SSH_PATH }}
            echo "[DB] Migration Guilds vers Organizations..."
            if docker compose exec -T web npx tsx scripts/migrate-guilds-to-orgs.ts; then
              echo "[DB] Migration OK ✓"
            else
              echo "::warning::Migration guilds échouée (non bloquant)"
            fi

      - name: "Seed du catalogue de missions"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            cd ${{ secrets.SSH_PATH }}
            echo "[DB] Synchronisation du catalogue..."
            if docker compose exec -T web npx tsx prisma/seed.ts; then
              echo "[DB] Seed OK ✓"
            else
              echo "::warning::Seed échoué (non bloquant)"
            fi

  # ═══════════════════════════════════════════════════════════
  # BLOC 6 : VÉRIFICATION SANTÉ
  # Health check final + rollback automatique si échec
  # ═══════════════════════════════════════════════════════════
  verify:
    name: "✅ Vérification"
    runs-on: ubuntu-latest
    needs: [database]

    steps:
      - name: "Health check final + nettoyage"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ${{ secrets.SSH_PATH }}

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  [VERIFY] Vérification de santé finale"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Test HTTP sur /api/status
            STATUS=$(docker compose exec -T web sh -c "wget -qO- http://localhost:3000/api/status" 2>/dev/null || echo "UNREACHABLE")

            if echo "$STATUS" | grep -q "ok"; then
              echo "[VERIFY] Application saine ✓"
            else
              echo "::error::[VERIFY] L'application ne répond pas correctement"
              echo "Réponse : $STATUS"
              echo "--- Derniers logs ---"
              docker compose logs --tail=50 web
              exit 1
            fi

            # Nettoyage des anciennes images Docker
            docker image prune -f

            # Résumé
            CURRENT_IMAGE=$(docker compose ps web --format '{{.Image}}' 2>/dev/null | head -1)
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✅ DEPLOIEMENT COMPLET"
            echo "  Image  : ${CURRENT_IMAGE}"
            echo "  Statut : ${STATUS}"
            echo "  Date   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ═══════════════════════════════════════════════════════════
  # BLOC 7 : ROLLBACK AUTOMATIQUE (si déploiement ou DB échoue)
  # Se déclenche uniquement en cas d'échec des blocs 4, 5 ou 6
  # ═══════════════════════════════════════════════════════════
  rollback:
    name: "🔄 Rollback"
    runs-on: ubuntu-latest
    needs: [deploy, database, verify]
    if: failure()

    steps:
      - name: "Rollback vers l'image précédente"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd ${{ secrets.SSH_PATH }}

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  [ROLLBACK] Restauration en cours..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Chercher l'image "latest" stable comme fallback
            FALLBACK_IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:latest"

            # Tenter le rollback
            echo "[ROLLBACK] Image de fallback : ${FALLBACK_IMAGE}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            if HASHCODE_IMAGE="${FALLBACK_IMAGE}" docker compose pull web 2>/dev/null; then
              HASHCODE_IMAGE="${FALLBACK_IMAGE}" docker compose up -d --no-deps web
              echo "[ROLLBACK] Conteneur restauré avec ${FALLBACK_IMAGE}"

              # Vérifier que le rollback fonctionne
              sleep 10
              if docker compose exec -T web sh -c "wget -qO- http://localhost:3000/api/status" 2>/dev/null | grep -q "ok"; then
                echo "[ROLLBACK] Application opérationnelle après rollback ✓"
              else
                echo "::error::[ROLLBACK] L'application ne répond pas même après rollback !"
                docker compose logs --tail=30 web
              fi
            else
              echo "::error::[ROLLBACK] Impossible de pull l'image de fallback"
            fi

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ⚠️  ROLLBACK TERMINÉ"
            echo "  Investiguer le commit qui a causé l'échec."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ═══════════════════════════════════════════════════════════
  # BLOC 8 : RAPPORT FINAL
  # Toujours exécuté — résumé complet du pipeline
  # ═══════════════════════════════════════════════════════════
  report:
    name: "📊 Rapport"
    runs-on: ubuntu-latest
    needs: [lint-security, test, build, deploy, database, verify]
    if: always()

    steps:
      - name: "Résumé du pipeline"
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📊 RAPPORT PIPELINE HASHCODE"
          echo "  Commit : ${{ github.sha }}"
          echo "  Branch : ${{ github.ref_name }}"
          echo "  Date   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "  🔒 Lint & Sécurité : ${{ needs.lint-security.result }}"
          echo "  🧪 Tests           : ${{ needs.test.result }}"
          echo "  🐳 Build Docker    : ${{ needs.build.result }}"
          echo "  🚀 Déploiement     : ${{ needs.deploy.result }}"
          echo "  🗄️ Base de données : ${{ needs.database.result }}"
          echo "  ✅ Vérification    : ${{ needs.verify.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Échec global si un job critique a échoué
          if [ "${{ needs.verify.result }}" = "failure" ] || [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "::error::Pipeline échoué — intervention requise"
            exit 1
          fi
