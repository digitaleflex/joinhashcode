name: "Reusable Security"

on:
  workflow_call:

jobs:
  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: "ESLint"
        run: pnpm run lint
      - name: "Audit npm"
        run: pnpm audit --audit-level=high || echo "::warning::Vulnerabilities found"
      - name: "Secrets Scan"
        run: |
          FOUND=0
          for PATTERN in "AKIA[0-9A-Z]{16}" "sk_live_" "ghp_[a-zA-Z0-9]{36}" "-----BEGIN.*PRIVATE KEY-----"; do
            if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
               -E "$PATTERN" . --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git 2>/dev/null; then
              echo "::error::Potential secret found: $PATTERN"
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 1 ] && exit 1 || echo "No secrets found"
