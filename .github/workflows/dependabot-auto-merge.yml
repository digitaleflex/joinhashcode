name: "Dependabot Auto-merge"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: "Auto-merge patch & minor"
    runs-on: ubuntu-latest
    # Uniquement sur les PRs Dependabot
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: "Fetch Dependabot metadata"
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # ── PATCH : auto-approve + auto-merge immédiat ──────────────────────────
      - name: "Approve - patch"
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr review --approve "$PR_URL" --body "Auto-approved (patch - no risk of breaking changes)"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Merge - patch (after CI)"
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── MINOR : auto-approve + auto-merge (après CI obligatoire) ───────────
      - name: "Approve - minor"
        if: steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL" --body "Auto-approved (minor - merged automatically if CI passes)"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Merge - minor (after CI)"
        if: steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── MAJOR : label + commentaire pour review manuelle ───────────────────
      - name: "Label - major (manual review required)"
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "dependencies" || true
          gh pr comment "$PR_URL" --body "Major update detected - manual review required before merge.

          **Package :** \`${{ steps.meta.outputs.dependency-names }}\`
          **Change :** \`${{ steps.meta.outputs.previous-version }}\` → \`${{ steps.meta.outputs.new-version }}\`

          Check the changelog for breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
