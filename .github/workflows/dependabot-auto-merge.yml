name: "Dependabot Auto-merge"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: "Intelligent Dependabot Auto-merge"
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: "Fetch Dependabot metadata"
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # ── [1/4] CRITICAL SECURITY FIXES : Auto-approve & auto-merge immediately ──
      - name: "Approve & Auto-merge - Security Fix"
        if: steps.meta.outputs.alert-state == 'fixed'
        run: |
          gh pr review --approve "$PR_URL" --body "🔒 Auto-approved: Security vulnerability fix detected. Merging automatically as soon as status checks pass."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── [2/4] PATCH & MINOR UPDATES : Auto-approve & auto-merge after CI ───────
      - name: "Approve & Auto-merge - Patch & Minor"
        if: |
          steps.meta.outputs.alert-state != 'fixed' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' || 
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: |
          gh pr review --approve "$PR_URL" --body "⚡ Auto-approved: Safe semver update (${{ steps.meta.outputs.update-type }}). Merging automatically as soon as status checks pass."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── [3/4] DEV DEPENDENCIES (MAJOR) : Auto-approve & auto-merge after CI ────
      # Since it is a devDependency (e.g. eslint, typescript, vitest), if it compiles 
      # and the test suite passes, we can safely merge it automatically.
      - name: "Approve & Auto-merge - Major DevDependency"
        if: |
          steps.meta.outputs.alert-state != 'fixed' &&
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          steps.meta.outputs.dependency-type == 'development'
        run: |
          gh pr review --approve "$PR_URL" --body "🧪 Auto-approved: Major devDependency update. Merging automatically as soon as test suite passes."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── [4/4] PRODUCTION (MAJOR) : Block & require manual review ───────────────
      - name: "Flag - Major Production Update"
        if: |
          steps.meta.outputs.alert-state != 'fixed' &&
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          steps.meta.outputs.dependency-type == 'production'
        run: |
          gh pr edit "$PR_URL" --add-label "dependencies" --add-label "security-review" || true
          gh pr comment "$PR_URL" --body "⚠️ **Review Manuelle Requise** 

          Une mise à jour **Majeure** sur une dépendance de **Production** a été détectée. Ce type de mise à jour peut introduire des ruptures de compatibilité (breaking changes).
          
          * **Package** : \`${{ steps.meta.outputs.dependency-names }}\`
          * **Changement** : \`${{ steps.meta.outputs.previous-version }}\` ➡️ \`${{ steps.meta.outputs.new-version }}\`
          
          Veuillez vérifier les changelogs et valider le fonctionnement de l'application en local avant de fusionner cette PR."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
