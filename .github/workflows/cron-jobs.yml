name: "Cron Jobs"

on:
  schedule:
    # Squad decay — tous les jours à 01h00 (Africa/Abidjan = UTC+0)
    - cron: "0 1 * * *"
    # Release claims — toutes les 6h (libère les reviews abandonnées après 48h)
    - cron: "0 */6 * * *"
  # Déclenchement manuel pour les tests
  workflow_dispatch:
    inputs:
      job:
        description: "Job à déclencher"
        required: true
        type: choice
        options:
          - squad-decay
          - release-claims
          - all

jobs:
  squad-decay:
    name: "Squad Cohesion Decay"
    runs-on: ubuntu-latest
    # Lance si : déclenchement planifié à 01h00 OU manuel squad-decay/all
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 1')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'squad-decay' || inputs.job == 'all'))
    steps:
      - name: "Trigger squad cohesion decay"
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/internal/cron/squad-decay")

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Squad decay failed with status $RESPONSE"
            exit 1
          fi

  release-claims:
    name: "Release Stale Mission Claims"
    runs-on: ubuntu-latest
    # Lance si : déclenchement planifié toutes les 6h OU manuel release-claims/all
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '*/6')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'release-claims' || inputs.job == 'all'))
    steps:
      - name: "Release expired claims (48h)"
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/internal/cron/release-claims")

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Release claims failed with status $RESPONSE"
            exit 1
          fi
