name: "Stale Issues & PRs"

on:
  schedule:
    # Tous les jours à 02h00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: "Nettoyer les issues inactives"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ── Issues ────────────────────────────────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            Cette issue n'a pas eu d'activité depuis **60 jours**.
            Elle sera fermée automatiquement dans 14 jours si aucune mise à jour n'est apportée.
            Si elle reste pertinente, laisse un commentaire ou réassigne-la à un milestone actif.
          close-issue-message: >
            Fermée automatiquement après 74 jours sans activité.
            Rouvre-la si le sujet redevient pertinent.

          # ── Pull Requests ─────────────────────────────────────────────────
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: >
            Cette PR n'a pas eu d'activité depuis **30 jours**.
            Elle sera fermée dans 7 jours sans mise à jour.
          close-pr-message: >
            Fermée automatiquement après 37 jours sans activité.

          # ── Exemptions ────────────────────────────────────────────────────
          # Ne pas toucher aux issues prêtes à être travaillées ou bloquées
          exempt-issue-labels: >
            status: ready,
            status: blocked,
            priority: critical,
            type: epic
          exempt-pr-labels: >
            status: ready,
            dependencies
          # Ne pas fermer les issues assignées à un milestone actif
          exempt-all-milestones: false
          exempt-milestones: >
            v2.0 — Lancement Public,
            v2.1 — Profil & Découverte,
            v2.2 — Communauté Active,
            v2.3 — Rétention & Sécurité

          # ── Limites ───────────────────────────────────────────────────────
          operations-per-run: 30
          remove-stale-when-updated: true
