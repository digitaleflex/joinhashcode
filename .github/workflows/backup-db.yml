name: Database Backup (Daily)

on:
  schedule:
    - cron: "0 4 * * *" # Tous les jours à 04h00 UTC
  workflow_dispatch:     # Lancement manuel possible depuis GitHub

jobs:
  backup:
    name: Dump via VPS → Artifact GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Préparer la clé SSH (même clé que le workflow deploy)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # 2. Lancer pg_dump DANS le conteneur db sur le VPS
      #    et streamer la sortie compressée vers le runner GitHub
      - name: Stream pg_dump from VPS container
        run: |
          FILENAME="hashcode-backup-$(date +%Y-%m-%d_%H-%M).sql.gz"

          ssh -p ${{ secrets.SSH_PORT || 22 }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ secrets.SSH_PATH }} && \
               docker compose exec -T db \
                 sh -c 'pg_dump -U \$POSTGRES_USER \$POSTGRES_DB'" \
          | gzip > "$FILENAME"

          echo "Backup terminé — taille : $(du -h "$FILENAME" | cut -f1)"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      # 3. Sauvegarder comme artifact GitHub (7 jours de rétention)
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.sql.gz"
          retention-days: 7
