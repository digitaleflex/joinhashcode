name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        run: |
          npm install -g pnpm --force
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build with env
        run: |
          set -a
          source /home/actions-runner/secrets/.env.production
          set +a
          pnpm run build

      - name: Verify standalone output
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone/ missing — build did not produce standalone output"
            ls -la .next/
            exit 1
          fi
          echo "Standalone output found: $(du -sh .next/standalone/ | cut -f1)"
          ls -la .next/standalone/

      - name: Build Docker image
        run: docker build --no-cache -t hashcode-web:latest .

      - name: Restart web container
        run: |
          docker rm -f hashcode-web 2>/dev/null || true
          docker compose -f compose.app.yml \
            --env-file /home/actions-runner/secrets/.env.production \
            up -d web --force-recreate
