name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        run: |
          npm install -g pnpm --force
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build with production env
        run: |
          set -a
          echo "$PRODUCTION_ENV" > .env.production
          source .env.production
          set +a
          pnpm run build
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-dummy-secret-32chars-minimum' }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}

      - name: Verify standalone output
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "ERROR: .next/standalone/ missing — build did not produce standalone output"
            ls -la .next/
            exit 1
          fi
          echo "Standalone output found: $(du -sh .next/standalone/ | cut -f1)"

      - name: Wire standalone asset symlinks
        run: |
          ln -sfn ../../static .next/standalone/.next/static
          ln -sfn ../../public .next/standalone/public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/standalone/
            .next/static/
            prisma/
            generated/
            public/
            Dockerfile
            prisma.config.ts
            compose.app.yml
            cluster.mjs
            scripts/deploy-install.sh
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./artifact

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy build & restart hashcode-web (retry x5)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e

          # Packer la build + le script d'install en un seul tarball
          echo "=== packaging artifact ==="
          tar -czf /tmp/hashcode-deploy.tgz -C artifact .

          # Boucle de retry : le chemin runner->VPS est instable, on retente
          success=0
          for i in 1 2 3 4 5; do
            echo ""
            echo "=== tentative $i/5 ==="
            if
              # Un seul flux TCP pour le gros du transfert (le tarball)
              ssh \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=4 \
                -o StrictHostKeyChecking=accept-new \
                -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                "$SSH_USER@$SSH_HOST" \
                'rm -rf /tmp/hashcode-deploy && mkdir -p /tmp/hashcode-deploy && tar -xzf - -C /tmp/hashcode-deploy' \
              < /tmp/hashcode-deploy.tgz \
              &&
              # Ensuite le même tarball est déplacé sur le VPS pour soirces scripts
              ssh \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 \
                -o ServerAliveCountMax=4 \
                -o StrictHostKeyChecking=accept-new \
                -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                "$SSH_USER@$SSH_HOST" \
                'bash /tmp/hashcode-deploy/scripts/deploy-install.sh'
            then
              success=1
              break
            fi
            echo "tentative $i échouée — nouvelle tentative"
            sleep 10
          done
          [ "$success" -eq 1 ]