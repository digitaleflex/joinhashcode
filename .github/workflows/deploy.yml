name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        run: |
          npm install -g pnpm --force
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Run database migrations (prisma migrate deploy)
        run: |
          set -a
          source /home/actions-runner/secrets/.env.production
          set +a
          npx prisma migrate deploy
      - name: Build with env
        run: |
          set -a
          source /home/actions-runner/secrets/.env.production
          set +a
          pnpm run build
      - run: docker build -t hashcode-web:latest .
      - name: Restart web container
        run: |
          docker rm -f hashcode-web 2>/dev/null || true
          docker compose -f compose.app.yml \
            --env-file /home/actions-runner/secrets/.env.production \
            up -d web --force-recreate
