name: CD (Continuous Deployment)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e  # Stoppe immédiatement si une commande échoue

            APP_DIR="${{ secrets.SSH_PATH }}"
            BACKUP="/tmp/.env.production.bak"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  HASHCODE — Deploiement en cours..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 1. Creer le dossier si besoin
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 2. Sauvegarder .env.production s'il existe (contient les secrets VPS)
            if [ -f ".env.production" ]; then
              echo "[1/6] Sauvegarde .env.production -> $BACKUP"
              cp .env.production "$BACKUP"
            fi

            # 3. Cloner ou mettre a jour le depot
            if [ ! -d ".git" ]; then
              echo "[2/6] Premier deploiement — nettoyage et clone..."
              find . -mindepth 1 -delete
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/digitaleflex/joinhashcode.git .
              echo "      Clone termine OK"
            else
              echo "[2/6] Mise a jour (git pull)..."
              git pull origin main
              echo "      Pull termine OK"
            fi

            # 4. Restaurer .env.production apres clone/pull
            if [ -f "$BACKUP" ]; then
              echo "[3/6] Restauration .env.production..."
              cp "$BACKUP" .env.production
              rm -f "$BACKUP"
            fi

            # 5. Verifier que .env.production est present avant de continuer
            if [ ! -f ".env.production" ]; then
              echo "ERREUR : .env.production introuvable dans $APP_DIR"
              echo "Creez-le manuellement sur le VPS puis relancez le pipeline."
              exit 1
            fi
            echo "[4/6] .env.production detecte OK"

            # 6. Reconstruire et relancer les conteneurs
            echo "[5/6] Reconstruction des conteneurs Docker..."
            docker compose down
            docker compose up -d --build

            # 7. Migrations + seed (dans le reseau Docker isole)
            echo "[6/6] Migrations Prisma + seed..."
            docker compose exec -T web npx prisma db push --accept-data-loss
            docker compose exec -T web npx prisma db seed

            # 8. Nettoyage des images obsoletes
            docker image prune -f

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  DEPLOIEMENT TERMINE AVEC SUCCES"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
