name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - run: npm run build
      - run: docker build -t hashcode-web:latest .
      - name: Restart web container
        run: |
          docker compose -f compose.app.yml \
            --env-file /home/actions-runner/secrets/.env.production \
            up -d web --force-recreate
