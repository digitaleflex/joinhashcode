name: CD (Continuous Deployment)

on:
  # Se déclenche UNIQUEMENT après que le CI a terminé avec succès
  workflow_run:
    workflows: ["CI (Continuous Integration)"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Ne déployer que si le CI a réussi
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REGISTRY,IMAGE_NAME
          script: |
            set -e

            APP_DIR="${{ secrets.SSH_PATH }}"
            BACKUP="/tmp/.env.production.bak"
            IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:latest"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  HASHCODE — Deploiement en cours..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 1. Creer le dossier si besoin
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 2. Sauvegarder .env.production
            if [ -f ".env.production" ]; then
              echo "[1/5] Sauvegarde .env.production -> $BACKUP"
              cp .env.production "$BACKUP"
            fi

            # 3. Cloner ou mettre a jour le depot (pour compose.yaml + prisma)
            if [ ! -d ".git" ]; then
              echo "[2/5] Premier deploiement — clone du depot..."
              find . -mindepth 1 -delete
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/digitaleflex/joinhashcode.git .
            else
              echo "[2/5] Mise a jour du depot (git pull)..."
              git reset --hard
              git pull origin main
            fi

            # 4. Restaurer .env.production (non versionne dans Git)
            if [ -f "$BACKUP" ]; then
              echo "[3/5] Restauration .env.production..."
              cp "$BACKUP" .env.production
              rm -f "$BACKUP"
            fi

            # 5. Verifier que .env.production est present
            if [ ! -f ".env.production" ]; then
              echo "ERREUR : .env.production introuvable dans $APP_DIR"
              echo "Creez-le manuellement sur le VPS puis relancez."
              exit 1
            fi
            echo "[4/5] .env.production detecte OK"

            # 6. Mise à jour des conteneurs
            echo "[5/5] Mise à jour des images et redémarrage..."
            docker compose pull
            docker compose up -d --no-deps web

            # 7. Déduplication des données avant d'appliquer les contraintes uniques
            # (évite l'erreur "duplicate key value" lors du db push si des doublons existent)
            echo "[DATABASE] Nettoyage des doublons en base..."
            docker compose exec -T web npx tsx scripts/dedup-constraints.ts

            # 7b. Appliquer les modifications de schéma (db push — pas de fichiers migration)
            echo "[DATABASE] Application du schéma Prisma..."
            docker compose exec -T web npx prisma db push

            # 8. Scripts de maintenance et synchro
            echo "[MIGRATION] Migration des Guilds vers Organizations..."
            docker compose exec -T web npx tsx scripts/migrate-guilds-to-orgs.ts

            echo "[SEED] Synchronisation du catalogue et du seed..."
            docker compose exec -T web npx tsx prisma/seed.ts

            # 10. Nettoyage des anciennes images
            docker image prune -f

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  DEPLOIEMENT TERMINE AVEC SUCCES"
            echo "  Image deployee : $IMAGE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

