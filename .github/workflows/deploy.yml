name: CD (Continuous Deployment)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Ensure the target directory exists on the VPS
            mkdir -p ${{ secrets.SSH_PATH }}
            cd ${{ secrets.SSH_PATH }}
            
            # Safely clone on first run, or pull changes on subsequent runs
            if [ ! -d ".git" ]; then
              echo "==== Initializing repository on VPS ===="
              git clone -b main https://github.com/digitaleflex/joinhashcode.git .
            else
              echo "==== Pulling latest changes ===="
              git pull origin main
            fi
            
            # Recreate and build production containers
            docker compose down
            docker compose up -d --build
            
            # Synchronize schema and seed initial data inside the running web container
            # (Ensures all operations happen inside the isolated network environment)
            docker compose exec -T web npx prisma db push --accept-data-loss
            docker compose exec -T web npx prisma db seed
            
            # Clean up old/dangling docker images to save server disk space
            docker image prune -f
            
            echo "==== DEPLOYMENT COMPLETED SUCCESSFULLY ===="
