name: CI (Continuous Integration)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ex: digitaleflex/joinhashcode

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Tests (rapide, parallèle au build)
  # ─────────────────────────────────────────────
  test:
    name: Tests & Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: hashcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js (avec cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'         # ← Cache node_modules entre les runs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up test environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public" >> $GITHUB_ENV
          echo "DIRECT_URL=postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=K4bEF/8phwv/Xx3fo//J0ltwp5aZDYvwF9wL79Q86+k=" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "QSTASH_TOKEN=dummy_ci_token" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Verify Database Schema
        run: pnpm prisma db push

      - name: Run Tests (Vitest)
        run: pnpm run test run

  # ─────────────────────────────────────────────
  # Job 2 : Build Docker + Push vers ghcr.io
  # (uniquement sur push, pas sur PR)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # Ne builder que si les tests passent ET on est sur un vrai push (pas PR)
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write    # Nécessaire pour pousser sur ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (builder multi-plateforme + cache)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Automatique, pas de secret à créer

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=postgresql://localhost:5432/build_placeholder
            DIRECT_URL=postgresql://localhost:5432/build_placeholder
          # ↓ Cache Docker layers dans GitHub Actions Cache (gratuit, persistant)
          cache-from: type=gha
          cache-to: type=gha,mode=max
