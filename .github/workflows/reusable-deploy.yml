name: "🚀 Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_PRIVATE_KEY: { required: true }
      SSH_PATH: { required: true }
      GH_PAT: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "SSH: Deploy & Maintain"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.SSH_PATH }}"
            IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
            
            cd "$APP_DIR"
            echo "--- [1/3] Deploiement de ${IMAGE} ---"
            [ -f ".env.production" ] && cp .env.production /tmp/.env.prod.bak
            
            if [ ! -d ".git" ]; then
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            else
              git reset --hard && git pull origin main
            fi
            
            [ -f "/tmp/.env.prod.bak" ] && mv /tmp/.env.prod.bak .env.production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            HASHCODE_IMAGE="$IMAGE" docker compose pull web
            HASHCODE_IMAGE="$IMAGE" docker compose up -d --no-deps web

            echo "--- [2/3] Base de Données ---"
            for i in {1..12}; do
              if docker compose exec -T web sh -c "wget -qO- http://localhost:3000/api/status" 2>/dev/null | grep -q "online"; then
                echo "App ready!" && break
              fi
              echo "Waiting... ($i)" && sleep 5
              [ $i -eq 12 ] && (echo "Timeout!" && exit 1)
            done

            docker compose exec -T web sh -c "
              npx prisma migrate deploy && \
              npx tsx scripts/migrate-guilds-to-orgs.ts || true && \
              npx tsx prisma/seed.ts || true
            "
            
            docker image prune -f
            echo "✅ Succès."

  verify:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: "Final Health Check"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            docker compose exec -T web sh -c "wget -qO- http://localhost:3000/api/status" 2>/dev/null | grep -q "online"

  rollback:
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure()
    steps:
      - name: "Rollback"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            HASHCODE_IMAGE="ghcr.io/${{ github.repository }}:latest" docker compose up -d web
