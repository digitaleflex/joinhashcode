name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

env:
  IMAGE: "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
  BACKUP_DIR: "/opt/hashcode/backups"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code (preserve .env.production)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Blue-Green Deploy (zero-downtime)
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          # ── Load env vars ──
          set -a
          . .env.production
          set +a

          # ════════════════════════════════════════════════════
          # [1/5] Docker login + pull image
          # ════════════════════════════════════════════════════
          echo "=== [1/5] Pulling image ==="
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ env.IMAGE }}"

          # ════════════════════════════════════════════════════
          # [2/5] Backup DB + migrate
          # ════════════════════════════════════════════════════
          echo "=== [2/5] Backup + migrate ==="
          mkdir -p "${{ env.BACKUP_DIR }}"
          docker exec hashcode-db pg_dump -U "${DB_USER}" -d "${DB_NAME}" -F c \
            -f "/tmp/pre_migrate_${TIMESTAMP}.dump"
          docker cp "hashcode-db:/tmp/pre_migrate_${TIMESTAMP}.dump" \
            "${{ env.BACKUP_DIR }}/pre_migrate_${TIMESTAMP}.dump"

          HASHCODE_IMAGE="${{ env.IMAGE }}" docker compose --env-file /opt/hashcode/.env.production run --rm \
            -e DATABASE_URL \
            -e DIRECT_URL \
            -e CI=true \
            web sh << 'DB_OPS'
              set -e
              npx prisma migrate deploy
              npx tsx scripts/check-auth-limits.ts || true
              npx prisma db seed
            DB_OPS

          # ════════════════════════════════════════════════════
          # [3/5] Blue-Green swap
          # ════════════════════════════════════════════════════
          echo "=== [3/5] Blue-Green swap ==="
          export HASHCODE_IMAGE="${{ env.IMAGE }}"
          docker compose -f compose.yaml -f compose.blue.yml up -d web-blue --wait --timeout 120

          echo "Switching traffic → blue..."
          docker stop hashcode-web 2>/dev/null || true
          docker rm hashcode-web 2>/dev/null || true
          docker rename hashcode-web-blue hashcode-web

          echo "✅ Blue-Green swap complete. Zero downtime."

          # ════════════════════════════════════════════════════
          # [4/5] Health check
          # ════════════════════════════════════════════════════
          echo "=== [4/5] Health check ==="
          MAX_RETRIES=8
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            RESPONSE=$(curl -sSf http://127.0.0.1:3000/api/status 2>/dev/null || echo "offline")
            if echo "$RESPONSE" | grep -q "online"; then
              echo "✅ App healthy: $RESPONSE"
              break
            fi
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES — retrying in 3s..."
            sleep 3
          done
          if ! echo "$RESPONSE" | grep -q "online"; then
            echo "::error::App not responding after swap ($MAX_RETRIES attempts)"
            docker compose --env-file /opt/hashcode/.env.production logs --tail=50 web || true
            exit 1
          fi

          # ════════════════════════════════════════════════════
          # [5/5] Cleanup
          # ════════════════════════════════════════════════════
          echo "=== [5/5] Cleanup ==="
          ls -t "${{ env.BACKUP_DIR }}" | tail -n +11 | xargs -r rm -f
          docker image prune -f --filter "until=24h"

          echo "✅ Deploy complete: ${{ inputs.image_tag }}"
