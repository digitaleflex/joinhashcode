name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_PATH: { required: true }
      GH_PAT: { required: true }
      B2_BUCKET: { required: false }

env:
  APP_DIR: ${{ secrets.SSH_PATH }}
  IMAGE: "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
  BACKUP_DIR: "${{ secrets.SSH_PATH }}/backups"
  PROD_ENV: "/home/actions-runner/secrets/.env.production"

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: "[1/9] Pulling code & image"
        run: |
          if [ ! -d ".git" ]; then
            git clone --depth 1 -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
          else
            git fetch --depth 1 origin main
            git reset --hard origin/main
          fi

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker image inspect "${{ env.IMAGE }}" >/dev/null 2>&1 || docker pull "${{ env.IMAGE }}"

      - name: "[2/6] Ensure volume exists"
        run: |
          docker volume inspect hashcode-postgres-data >/dev/null 2>&1 || docker volume create hashcode-postgres-data

      - name: "[3/6] Ensure DB is running"
        run: |
          if docker ps -q --filter name=hashcode-db --filter status=running | grep -q .; then
            echo "hashcode-db already running"
          else
            echo "Starting hashcode-db..."
            docker start hashcode-db || docker compose -f compose.db.yml --env-file ${{ env.PROD_ENV }} up -d db
          fi
          # Wait for DB to be healthy
          for i in $(seq 1 30); do
            if docker exec hashcode-db pg_isready -q 2>/dev/null; then
              echo "DB is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::DB not ready after 60s"
          docker logs hashcode-db --tail 30
          exit 1

      - name: "[4/9] Backup DB + migrate"
        run: |
          set -a
          source ${{ env.PROD_ENV }}
          set +a

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p "${{ env.BACKUP_DIR }}"
          docker exec hashcode-db pg_dump -U "${DB_USER}" -d "${DB_NAME}" -F c \
            -f "/tmp/pre_migrate_${TIMESTAMP}.dump"
          docker cp "hashcode-db:/tmp/pre_migrate_${TIMESTAMP}.dump" \
            "${{ env.BACKUP_DIR }}/pre_migrate_${TIMESTAMP}.dump"

          DB_URL="postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public"
          docker run --rm --network hashcode-db-network \
            -e DATABASE_URL="${DB_URL}" \
            -e DIRECT_URL="${DB_URL}" \
            -e NODE_ENV=production \
            "${{ env.IMAGE }}" \
            sh -c "npx prisma migrate deploy && (npx tsx scripts/check-auth-limits.ts || true)"

      - name: "[5/9] Blue-Green swap"
        run: |
          # Determine active / inactive container
          A_RUNNING=$(docker ps -q --filter name=hashcode-web-a | grep -q . && echo "yes" || echo "no")
          B_RUNNING=$(docker ps -q --filter name=hashcode-web-b | grep -q . && echo "yes" || echo "no")

          if [ "$A_RUNNING" = "yes" ] && [ "$B_RUNNING" = "no" ]; then
            ACTIVE="a"; INACTIVE="b"
          elif [ "$B_RUNNING" = "yes" ] && [ "$A_RUNNING" = "no" ]; then
            ACTIVE="b"; INACTIVE="a"
          elif [ "$A_RUNNING" = "yes" ] && [ "$B_RUNNING" = "yes" ]; then
            echo "Both running — cleaning B, deploying to B"
            docker compose -f compose.app.yml stop web-b
            docker compose -f compose.app.yml rm -f web-b
            ACTIVE="a"; INACTIVE="b"
          else
            echo "No containers running — first deploy to A"
            ACTIVE=""; INACTIVE="a"
          fi

          echo "Active: web-${ACTIVE:-none}, Deploying to: web-${INACTIVE}"

          if [ "$INACTIVE" = "a" ]; then
            export HASHCODE_WEB_A_IMAGE="${{ env.IMAGE }}"
          else
            export HASHCODE_WEB_B_IMAGE="${{ env.IMAGE }}"
          fi

          docker compose -f compose.app.yml \
            --env-file ${{ env.PROD_ENV }} \
            up -d "web-${INACTIVE}" --wait --timeout 120

          sleep 2

          if [ -n "$ACTIVE" ]; then
            echo "Switching traffic → web-${INACTIVE}..."
            docker compose -f compose.app.yml stop "web-${ACTIVE}"
            docker compose -f compose.app.yml rm -f "web-${ACTIVE}"
          fi

          echo "✅ Blue-Green swap complete. Zero downtime."

      - name: "[6/9] Health check"
        run: |
          MAX_RETRIES=8
          RETRY_COUNT=0

          if docker ps -q --filter name=hashcode-web-a | grep -q .; then
            CONTAINER="hashcode-web-a"
          elif docker ps -q --filter name=hashcode-web-b | grep -q .; then
            CONTAINER="hashcode-web-b"
          else
            echo "::error::No web container running after swap"
            exit 1
          fi

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            RESPONSE=$(docker exec "$CONTAINER" node -e "fetch('http://127.0.0.1:3000/api/status').then(r=>r.text()).then(t=>{console.log(t);process.exit(0)}).catch(()=>process.exit(1))" 2>/dev/null || echo "offline")
            if echo "$RESPONSE" | grep -q "online"; then
              echo "✅ App healthy: $RESPONSE"
              break
            fi
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES — retrying in 3s..."
            sleep 3
          done

          if ! echo "$RESPONSE" | grep -q "online"; then
            echo "::error::App not responding after swap ($MAX_RETRIES attempts)"
            docker logs "$CONTAINER" --tail 50 2>/dev/null || true
            exit 1
          fi

      - name: "[7/9] Upload backup to artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ inputs.image_tag }}
          path: ${{ env.BACKUP_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: "[8/9] Sync to Backblaze B2"
        run: |
          if [ -n "${B2_BUCKET}" ]; then
            rclone copy "${{ env.BACKUP_DIR }}/" "b2:${B2_BUCKET}/deploy/"
            echo "✅ Synced to Backblaze B2"
          else
            echo "⚠️  B2_BUCKET not set — skipping"
          fi
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}

      - name: "[9/9] Cleanup"
        run: |
          ls -t "${{ env.BACKUP_DIR }}" | tail -n +11 | xargs -r rm -f
          docker image prune -f --filter "until=24h"
          echo "✅ Deploy complete: ${{ inputs.image_tag }}"

      - name: "[10/9] Create issue on failure"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ inputs.image_tag }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deploy failed — ${tag}`,
              body: [
                `## Deploy Failure`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **Image** | ${tag} |`,
                `| **Run** | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
                `| **Trigger** | ${{ github.event_name }} |`,
                `| **Branch** | ${{ github.ref_name }} |`,
                ``,
                `The deployment pipeline failed. Check the workflow logs for details.`,
              ].join('\n'),
              labels: ['deploy', 'automated', 'critical'],
            });
