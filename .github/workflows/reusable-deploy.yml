name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_PRIVATE_KEY: { required: true }
      SSH_PATH: { required: true }
      GH_PAT: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "SSH: Deploy, Verify and Maintain"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.SSH_PATH }}"
            IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"

            cd "$APP_DIR"

            # ── [1/5] Pull new image ──────────────────────────────────────────
            echo "--- [1/5] Pulling ${IMAGE} ---"
            [ -f ".env.production" ] && cp .env.production /tmp/.env.prod.bak

            if [ ! -d ".git" ]; then
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            else
              git reset --hard && git pull origin main
            fi

            [ -f "/tmp/.env.prod.bak" ] && mv /tmp/.env.prod.bak .env.production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production pull

            # ── [2/5] Migrate BEFORE starting the app ────────────────────────
            echo "--- [2/5] Running database migrations ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production run --rm \
              -e DATABASE_URL \
              -e DIRECT_URL \
              web sh -c "npx prisma migrate deploy"

            # ── [2.5/5] Audit Better Auth limits (warn only, never blocks) ───
            echo "--- [2.5/5] Checking org/member limits ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production run --rm \
              -e DATABASE_URL \
              -e DIRECT_URL \
              -e CI=true \
              web sh -c "npx tsx scripts/check-auth-limits.ts" || true

            # ── [3/5] Seed (idempotent upserts only) ─────────────────────────
            echo "--- [3/5] Running seed ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production run --rm \
              -e DATABASE_URL \
              -e DIRECT_URL \
              web sh -c "npx prisma db seed"

            # ── [4/5] Start / restart the application ────────────────────────
            echo "--- [4/5] Starting application ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production up -d

            # ── [5/5] Verify Health & Rollback if failure ───────────────────
            echo "--- [5/5] Running health check ---"
            MAX=30
            HEALTHY=false
            for i in $(seq 1 $MAX); do
              RESPONSE=$(docker compose --env-file .env.production exec -T web sh -c "wget -qO- http://127.0.0.1:3000/api/status" 2>/dev/null || echo "offline")
              if echo "$RESPONSE" | grep -q "online"; then
                echo "App healthy: $RESPONSE"
                HEALTHY=true
                break
              fi
              echo "Waiting for container to become healthy... ($i/$MAX)"
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "::error::Health check timed out. Initiating rollback..."
              docker compose --env-file .env.production logs --tail=100 web || true
              
              echo "Rolling back to :latest image..."
              HASHCODE_IMAGE="ghcr.io/${{ github.repository }}:latest" docker compose --env-file .env.production up -d web
              echo "Rollback complete."
              exit 1
            fi

            docker image prune -f
            echo "Deployment and verification completed successfully."
