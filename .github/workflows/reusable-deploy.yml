name: "🚀 Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_PRIVATE_KEY: { required: true }
      SSH_PATH: { required: true }
      GH_PAT: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "SSH: Deploy & Maintain"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.SSH_PATH }}"
            IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
            
            cd "$APP_DIR"
            echo "--- [1/3] Deploiement de ${IMAGE} ---"
            [ -f ".env.production" ] && cp .env.production /tmp/.env.prod.bak
            
            if [ ! -d ".git" ]; then
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            else
              git reset --hard && git pull origin main
            fi
            
            [ -f "/tmp/.env.prod.bak" ] && mv /tmp/.env.prod.bak .env.production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production pull
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production up -d

            echo "--- [2/3] Base de Données ---"
            echo "Waiting for app to be ready at http://127.0.0.1:3000/api/status..."
            for i in {1..24}; do
              RESPONSE=$(docker compose --env-file .env.production exec -T web sh -c "wget -qO- http://127.0.0.1:3000/api/status" 2>/dev/null || echo "offline")
              if echo "$RESPONSE" | grep -q "online"; then
                echo "App ready! Response: $RESPONSE"
                break
              fi
              echo "Waiting... ($i/24) - Current status: $RESPONSE"
              sleep 5
              if [ $i -eq 24 ]; then
                echo "::error::Timeout reached! Application failed to start or DB is unreachable."
                echo "--- Container Logs ---"
                docker compose --env-file .env.production logs --tail=50 web
                exit 1
              fi
            done

            docker compose --env-file .env.production exec -T web sh -c "
              npx prisma migrate reset --force && \
              npx tsx prisma/seed.ts
            "
            
            docker image prune -f
            echo "✅ Succès."

  verify:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: "Final Health Check"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            docker compose --env-file .env.production exec -T web sh -c "wget -qO- http://127.0.0.1:3000/api/status" 2>/dev/null | grep -q "online"

  rollback:
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure()
    steps:
      - name: "Rollback"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            HASHCODE_IMAGE="ghcr.io/${{ github.repository }}:latest" docker compose --env-file .env.production up -d web
