name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_PATH: { required: true }
      GH_PAT: { required: true }

env:
  APP_DIR: ${{ secrets.SSH_PATH }}
  IMAGE: "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
  BACKUP_DIR: "${{ secrets.SSH_PATH }}/backups"

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: "[1/5] Pulling code & image"
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          [ -f ".env.production" ] && cp .env.production "/tmp/env_${TIMESTAMP}"

          if [ ! -d ".git" ]; then
            git clone --depth 1 -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
          else
            git fetch --depth 1 origin main
            git reset --hard origin/main
          fi

          [ -f "/tmp/env_${TIMESTAMP}" ] && mv "/tmp/env_${TIMESTAMP}" .env.production

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ env.IMAGE }}"

      - name: "[2/5] Ensure DB is running"
        run: |
          docker network prune -f 2>/dev/null || true
          docker rm -f hashcode-db 2>/dev/null || true
          echo "Starting hashcode-db..."
          docker compose --env-file .env.production up -d db --wait

      - name: "[3/5] Backup DB + migrate"
        run: |
          set -a
          . .env.production
          set +a

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p "${{ env.BACKUP_DIR }}"
          docker exec hashcode-db pg_dump -U "${DB_USER}" -d "${DB_NAME}" -F c \
            -f "/tmp/pre_migrate_${TIMESTAMP}.dump"
          docker cp "hashcode-db:/tmp/pre_migrate_${TIMESTAMP}.dump" \
            "${{ env.BACKUP_DIR }}/pre_migrate_${TIMESTAMP}.dump"

          HASHCODE_IMAGE="${{ env.IMAGE }}" docker compose --env-file .env.production run --rm \
            -e DATABASE_URL \
            -e DIRECT_URL \
            -e CI=true \
            web sh -c "set -e; npx prisma migrate deploy; npx tsx scripts/check-auth-limits.ts || true; npx prisma db seed"

      - name: "[4/5] Blue-Green swap"
        run: |
          export HASHCODE_IMAGE="${{ env.IMAGE }}"
          sudo docker compose -f compose.yaml -f compose.blue.yml up -d web-blue --wait --timeout 120

          echo "Switching traffic → blue..."
          sudo docker stop hashcode-web 2>/dev/null || true
          sudo docker rm hashcode-web 2>/dev/null || true
          sudo docker rename hashcode-web-blue hashcode-web

          echo "✅ Blue-Green swap complete. Zero downtime."

      - name: "[5/5] Health check"
        run: |
          MAX_RETRIES=8
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            RESPONSE=$(docker exec hashcode-web node -e "fetch('http://127.0.0.1:3000/api/status').then(r=>r.text()).then(t=>{console.log(t);process.exit(0)}).catch(()=>process.exit(1))" 2>/dev/null || echo "offline")
            if echo "$RESPONSE" | grep -q "online"; then
              echo "✅ App healthy: $RESPONSE"
              break
            fi
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES — retrying in 3s..."
            sleep 3
          done
          if ! echo "$RESPONSE" | grep -q "online"; then
            echo "::error::App not responding after swap ($MAX_RETRIES attempts)"
            docker compose --env-file .env.production logs --tail=50 web || true
            exit 1
          fi

      - name: "[6/6] Cleanup"
        run: |
          ls -t "${{ env.BACKUP_DIR }}" | tail -n +11 | xargs -r rm -f
          docker image prune -f --filter "until=24h"
          echo "✅ Deploy complete: ${{ inputs.image_tag }}"
