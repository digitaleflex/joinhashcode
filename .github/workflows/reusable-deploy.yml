name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_PATH: { required: true }
      GH_PAT: { required: true }
      B2_BUCKET: { required: false }

env:
  APP_DIR: ${{ secrets.SSH_PATH }}
  IMAGE: "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
  BACKUP_DIR: "${{ secrets.SSH_PATH }}/backups"
  PROD_ENV: "/home/actions-runner/secrets/.env.production"

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: "[1/6] Pull code & image"
        run: |
          if [ ! -d ".git" ]; then
            git clone --depth 1 -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
          else
            git fetch --depth 1 origin main
            git reset --hard origin/main
          fi

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker image inspect "${{ env.IMAGE }}" >/dev/null 2>&1 || docker pull "${{ env.IMAGE }}"

      - name: "[2/6] Ensure DB is running"
        run: |
          if ! docker ps -q --filter name=hashcode-db --filter status=running | grep -q .; then
            echo "Starting hashcode-db..."
            docker start hashcode-db || docker compose -f compose.db.yml --env-file ${{ env.PROD_ENV }} up -d db
          fi

          # Ensure container is connected to the network
          if ! docker inspect hashcode-db --format '{{json .NetworkSettings.Networks}}' | grep -q hashcode-db-network; then
            docker network connect hashcode-db-network hashcode-db 2>/dev/null || true
          fi

          # Brief health wait (15s) — compose healthcheck handles the rest
          for i in $(seq 1 8); do
            docker exec hashcode-db pg_isready -q 2>/dev/null && echo "DB ready" && exit 0
            sleep 2
          done
          echo "::error::DB not ready after 16s"
          docker logs hashcode-db --tail 30
          exit 1

      - name: "[3/6] Backup DB + migrate"
        run: |
          set -a
          source ${{ env.PROD_ENV }}
          set +a

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p "${{ env.BACKUP_DIR }}"
          docker exec hashcode-db pg_dump -U "${DB_USER}" -d "${DB_NAME}" -F c \
            -f "/tmp/pre_migrate_${TIMESTAMP}.dump"
          docker cp "hashcode-db:/tmp/pre_migrate_${TIMESTAMP}.dump" \
            "${{ env.BACKUP_DIR }}/pre_migrate_${TIMESTAMP}.dump"
          docker exec hashcode-db rm -f "/tmp/pre_migrate_${TIMESTAMP}.dump"

          DB_URL="postgresql://${DB_USER}:${DB_PASSWORD}@hashcode-db:5432/${DB_NAME}?schema=public"
          docker run --rm --network hashcode-db-network \
            -e DATABASE_URL="${DB_URL}" \
            -e DIRECT_URL="${DB_URL}" \
            -e NODE_ENV=production \
            "${{ env.IMAGE }}" \
            sh -c "prisma migrate deploy && prisma migrate status"

      - name: "[4/6] Deploy single container with rollback"
        run: |
          # Clean up legacy blue-green containers if they are still running
          for old in hashcode-web-a hashcode-web-b; do
            if docker ps -q --filter name="$old" | grep -q .; then
              echo "Stopping legacy container $old..."
              docker stop -t 60 "$old" 2>/dev/null || true
              docker rm -f "$old" 2>/dev/null || true
            fi
          done

          export HASHCODE_WEB_IMAGE="${{ env.IMAGE }}"

          # Start the single web container — `--wait` blocks until compose healthcheck passes.
          if docker compose -f compose.app.yml \
            --env-file ${{ env.PROD_ENV }} \
            up -d web --wait --timeout 120; then
              echo "✅ web is healthy"
          else
              echo "::error::web failed health check — rolling back"
              echo "=== Logs from failed container hashcode-web ==="
              docker logs hashcode-web --tail 80 2>&1 || true
              echo "=== Container inspect ==="
              docker inspect hashcode-web --format='{{json .State}}' 2>&1 || true
              docker compose -f compose.app.yml rm -f web
              exit 1
          fi

          echo "✅ Single-container deploy complete."

      - name: "[5/6] Smoke tests"
        run: |
          set -a
          source ${{ env.PROD_ENV }}
          set +a

          BASE_URL="https://${APP_DOMAIN}"
          echo "Running smoke tests against ${BASE_URL}..."

          # /api/status should return 200 with "online"
          for i in $(seq 1 10); do
            STATUS_BODY=$(curl -sf "${BASE_URL}/api/status" 2>/dev/null || echo "offline")
            if echo "$STATUS_BODY" | grep -q "online"; then
              echo "✅ /api/status is online"
              break
            fi
            echo "Smoke attempt $i/10 — retrying in 3s..."
            sleep 3
          done
          if ! echo "$STATUS_BODY" | grep -q "online"; then
            echo "::error::Smoke test failed: /api/status is not online"
            exit 1
          fi

          # /signin should be reachable (200)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/signin")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ /signin returns 200"
          else
            echo "::error::Smoke test failed: /signin returned HTTP $HTTP_CODE"
            exit 1
          fi

          # /dashboard should redirect unauthenticated users (302/307) — proves middleware works
          DASH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${BASE_URL}/dashboard")
          if [ "$DASH_CODE" = "302" ] || [ "$DASH_CODE" = "307" ] || [ "$DASH_CODE" = "200" ]; then
            echo "✅ /dashboard reachable (HTTP $DASH_CODE)"
          else
            echo "::error::Smoke test failed: /dashboard returned unexpected HTTP $DASH_CODE"
            exit 1
          fi

          echo "✅ All smoke tests passed"

      - name: "[6/6] Sync backup to B2 + cleanup"
        run: |
          # Sync to Backblaze B2 (if configured)
          if [ -n "${B2_BUCKET}" ]; then
            rclone copy "${{ env.BACKUP_DIR }}/" "b2:${B2_BUCKET}/deploy/"
            echo "✅ Synced to Backblaze B2"
          else
            echo "⚠️  B2_BUCKET not set — skipping B2 sync"
          fi

          # Keep only the 10 most recent local backups
          ls -t "${{ env.BACKUP_DIR }}" 2>/dev/null | tail -n +11 | xargs -r -I{} rm -f "${{ env.BACKUP_DIR }}/{}"

          # Prune dangling images older than 24h
          docker image prune -f --filter "until=24h"

          echo "✅ Deploy complete: ${{ inputs.image_tag }}"
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
