name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_PRIVATE_KEY: { required: true }
      SSH_PATH: { required: true }
      GH_PAT: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "SSH: Deploy and Maintain"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.SSH_PATH }}"
            IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"

            cd "$APP_DIR"

            # ── [1/4] Pull new image ──────────────────────────────────────────
            echo "--- [1/4] Pulling ${IMAGE} ---"
            [ -f ".env.production" ] && cp .env.production /tmp/.env.prod.bak

            if [ ! -d ".git" ]; then
              git clone -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            else
              git reset --hard && git pull origin main
            fi

            [ -f "/tmp/.env.prod.bak" ] && mv /tmp/.env.prod.bak .env.production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production pull

            # ── [2/4] Migrate BEFORE starting the app ────────────────────────
            # Running migrations as a one-off container ensures the schema is
            # up-to-date before any request can hit the new columns.
            # If this step fails, the app never starts with incompatible code.
            echo "--- [2/4] Running database migrations ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production run --rm \
              -e DATABASE_URL \
              -e DIRECT_URL \
              web sh -c "npx prisma migrate deploy"

            # ── [3/4] Seed (idempotent upserts only) ─────────────────────────
            echo "--- [3/4] Running seed ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production run --rm \
              -e DATABASE_URL \
              -e DIRECT_URL \
              web sh -c "npx tsx prisma/seed.ts"

            # ── [4/4] Start / restart the application ────────────────────────
            echo "--- [4/4] Starting application ---"
            HASHCODE_IMAGE="$IMAGE" docker compose --env-file .env.production up -d

            docker image prune -f
            echo "Deployment complete."

  verify:
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: "Final Health Check"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            MAX=30
            for i in $(seq 1 $MAX); do
              RESPONSE=$(docker compose --env-file .env.production exec -T web sh -c "wget -qO- http://127.0.0.1:3000/api/status" 2>/dev/null || echo "offline")
              if echo "$RESPONSE" | grep -q "online"; then
                echo "App healthy: $RESPONSE"
                exit 0
              fi
              echo "Waiting... ($i/$MAX)"
              sleep 5
            done
            echo "::error::Health check timed out"
            docker compose --env-file .env.production logs --tail=100 web
            exit 1

  rollback:
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure()
    steps:
      - name: "Rollback to :latest"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            echo "Rolling back to :latest image..."
            HASHCODE_IMAGE="ghcr.io/${{ github.repository }}:latest" \
              docker compose --env-file .env.production up -d web
            echo "Rollback complete."
