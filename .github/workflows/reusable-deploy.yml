name: "Reusable Deployment"

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_PRIVATE_KEY: { required: true }
      SSH_PATH: { required: true }
      GH_PAT: { required: true }

env:
  APP_DIR: ${{ secrets.SSH_PATH }}
  IMAGE: "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
  BACKUP_DIR: "${{ secrets.SSH_PATH }}/backups"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "SSH: Smart Deploy with Rollback Safety"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            # ── Load env vars for DB ops ──────────────────────────────────────
            export $(grep -v '^\s*#' .env.production | grep -v '^\s*$' | xargs)

            # ══════════════════════════════════════════════════════════════════
            # [1/6] Pull source & image
            # ══════════════════════════════════════════════════════════════════
            echo "=== [1/6] Pulling source ($TIMESTAMP) ==="

            # Preserve .env before git reset
            [ -f ".env.production" ] && cp .env.production "/tmp/env_${TIMESTAMP}"

            # Shallow fetch: 1 commit suffit pour un déploiement
            if [ ! -d ".git" ]; then
              git clone --depth 1 -b main https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            else
              git fetch --depth 1 origin main
              git reset --hard origin/main
            fi

            # Restore .env.production (ne pas versionner les secrets)
            [ -f "/tmp/env_${TIMESTAMP}" ] && mv "/tmp/env_${TIMESTAMP}" .env.production

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            HASHCODE_IMAGE="${{ env.IMAGE }}" docker compose --env-file .env.production pull web

            # ══════════════════════════════════════════════════════════════════
            # [2/6] Backup DB (pg_dump) avant toute migration
            # ══════════════════════════════════════════════════════════════════
            echo "=== [2/6] Backing up DB ==="
            mkdir -p "${{ env.BACKUP_DIR }}"
            docker exec hashcode-db pg_dump -U "${DB_USER}" -d "${DB_NAME}" -F c \
              -f "/tmp/pre_migrate_${TIMESTAMP}.dump"
            docker cp "hashcode-db:/tmp/pre_migrate_${TIMESTAMP}.dump" \
              "${{ env.BACKUP_DIR }}/pre_migrate_${TIMESTAMP}.dump"
            echo "Saved: backups/pre_migrate_${TIMESTAMP}.dump"

            # ══════════════════════════════════════════════════════════════════
            # [3/6] DB ops: migrate + audit + seed (1 seul container = +rapide)
            # ══════════════════════════════════════════════════════════════════
            echo "=== [3/6] Running DB operations ==="
            HASHCODE_IMAGE="${{ env.IMAGE }}" docker compose --env-file .env.production run --rm \
              -e DATABASE_URL \
              -e DIRECT_URL \
              -e CI=true \
              web sh << 'DB_OPS'
                set -e
                echo "--- prisma migrate deploy ---"
                npx prisma migrate deploy

                echo "--- check auth limits ---"
                npx tsx scripts/check-auth-limits.ts || true

                echo "--- prisma db seed (upsert safe) ---"
                npx prisma db seed
              DB_OPS

            # ══════════════════════════════════════════════════════════════════
            # [4/6] Start app (--wait = attend le healthcheck Docker)
            # ══════════════════════════════════════════════════════════════════
            echo "=== [4/6] Starting application ==="
            export HASHCODE_IMAGE="${{ env.IMAGE }}"
            docker compose --env-file .env.production up -d --wait --timeout 120

            # ══════════════════════════════════════════════════════════════════
            # [5/6] Health check + Rollback si échec
            # ══════════════════════════════════════════════════════════════════
            echo "=== [5/6] Health check ==="
            HEALTHY=false
            for i in $(seq 1 12); do
              sleep 5
              RESPONSE=$(curl -sSf http://127.0.0.1:3000/api/status 2>/dev/null || echo "offline")
              if echo "$RESPONSE" | grep -q "online"; then
                echo "✅ Healthy after $((i * 5))s: $RESPONSE"
                HEALTHY=true
                break
              fi
              echo "Waiting... ($i/12)"
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "::error::Health check failed. Rolling back..."

              # 1. Logs pour debug
              docker compose --env-file .env.production logs --tail=100 web || true

              # 2. Rollback app → latest image
              LATEST_IMAGE="ghcr.io/${{ github.repository }}:latest"
              export HASHCODE_IMAGE="$LATEST_IMAGE"
              docker compose --env-file .env.production up -d

              # 3. Rollback DB → restore backup
              echo "Restoring DB from backup..."
              BACKUP_FILE=$(ls -t "${{ env.BACKUP_DIR }}" | head -1)
              if [ -n "$BACKUP_FILE" ]; then
                docker exec -i hashcode-db pg_restore -U "${DB_USER}" -d "${DB_NAME}" \
                  --clean --if-exists < "${{ env.BACKUP_DIR }}/${BACKUP_FILE}" 2>&1 || true
                echo "DB restored from: $BACKUP_FILE"
              fi

              exit 1
            fi

            # ══════════════════════════════════════════════════════════════════
            # [6/6] Cleanup: garder les 10 derniers backups
            # ══════════════════════════════════════════════════════════════════
            echo "=== [6/6] Cleanup ==="
            ls -t "${{ env.BACKUP_DIR }}" | tail -n +11 | xargs -r rm -f
            docker image prune -f --filter "until=24h"

            echo "✅ Deploy complete: ${{ inputs.image_tag }}"
