name: "Reusable Tests"

on:
  workflow_call:
    secrets:
      BETTER_AUTH_SECRET:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: hashcode
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Set test environment
        run: |
          echo "DATABASE_URL=postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public" >> $GITHUB_ENV
          echo "DIRECT_URL=postgresql://postgres:localpassword@localhost:5432/hashcode?schema=public" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET || 'ci_test_secret_32chars_placeholder' }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=http://localhost:3000" >> $GITHUB_ENV
      - name: "Prisma Setup"
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
      - name: "Tests"
        run: pnpm run test run
