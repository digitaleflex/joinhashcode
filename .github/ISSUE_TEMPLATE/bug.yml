name: "🐛 Bug"
description: "Comportement inattendu ou erreur"
labels: ["type: bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: "Sévérité"
      options:
        - "critical — prod cassée ou données perdues"
        - "high — fonctionnalité principale inutilisable"
        - "medium — bug gênant avec contournement"
        - "low — cosmétique ou edge case rare"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Zone affectée"
      options:
        - "auth — connexion / session"
        - "onboarding — inscription / quiz"
        - "dashboard — page principale"
        - "missions — système de missions / XP"
        - "squad — escouades / cohésion"
        - "dossier — profil / carte membre"
        - "settings — paramètres"
        - "admin — interface admin"
        - "api — route API"
        - "middleware — redirections / protection"
        - "ui — composant visuel"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Étapes pour reproduire"
      value: |
        1. Aller sur ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Comportement actuel"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Contexte"
      description: "Navigateur, OS, compte utilisateur concerné, logs console/réseau"
