# ────────────────────────────────────────────────────────────────
# Application web (stack indépendante de la base de données)
# Un seul service `web` pour un déploiement simple et robuste.
#
# Lancement (production) :
#   docker compose -f compose.app.yml \
#     --env-file /home/audest/hashcode-community/.env.production \
#     up -d web --wait
#
# Variables Docker (DB_USER, DB_PASSWORD, APP_DOMAIN…) injectées
# via --env-file.  Secrets applicatifs chargés via env_file absolu.
# ────────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${HASHCODE_WEB_IMAGE:-hashcode-web:latest}
    container_name: hashcode-web
    restart: always
    env_file:
      - ${APP_ENV_FILE:-/home/audest/hashcode-community/.env.production}
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public&sslmode=disable
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public&sslmode=disable
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      WEB_CONCURRENCY: "2"
      # ⚡ Perf: Pointer vers le proxy Redis/SRH local sur le VPS (latence <1ms)
      REDIS_URL: http://redis-proxy:80
      REDIS_TOKEN: ${REDIS_TOKEN:-local-dev-token}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s
    volumes:
      # Uploads persistants — volume nommé
      - uploads_data:/app/public/uploads
      # Bind mounts — le build host est monté dans le conteneur
      # Pas besoin de rebuild l'image Docker à chaque déploiement
      #
      # ⚠️ Un `npm run build` efface .next/ (nouveaux inodes) : le conteneur
      # qui tourne reste épinglé sur les anciens inodes jusqu'à sa
      # recréation. Toujours déployer via ./deploy.sh (force-recreate).
      - ./.next/standalone:/app/.next/standalone
      # Cache instable_cache — sous-montage dédié en écriture
      - ./.next/standalone/.next/cache:/app/.next/standalone/.next/cache
      # Assets statiques (CSS/JS/fonts) servis par server.js standalone.
      # Mount direct dans l'arbre standalone : plus aucun symlink à maintenir.
      - ./.next/static:/app/.next/standalone/.next/static:ro
      # Dossier public vu par le serveur standalone (favicon, images…)
      - ./public:/app/.next/standalone/public:ro
      # Uploads servis par le standalone — même volume que /app/public/uploads
      - uploads_data:/app/.next/standalone/public/uploads
      # Wrapper multi-process (cluster Node) — même code que server.js
      - ./cluster.mjs:/app/cluster.mjs:ro
      # Entrypoint monté : les modifs s'appliquent sans rebuild d'image
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - ./prisma:/app/prisma:ro
      - ./prisma.config.ts:/app/prisma.config.ts:ro
      - ./generated:/app/generated:ro
      # public en rw (nécessaire pour que le sous-mount uploads_data fonctionne)
      - ./public:/app/public:rw
    networks:
      - db-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-web.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-web.entrypoints=websecure"
      - "traefik.http.routers.hashcode-web.tls=true"
      - "traefik.http.routers.hashcode-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-web.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.compress.compress=true"
      - "traefik.http.routers.hashcode-web.middlewares=compress"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 768M

volumes:
  uploads_data:
    external: true
    name: hashcode-uploads-data

networks:
  db-network:
    external: true
    name: hashcode-db-network
  proxy:
    external: true
    name: proxy
