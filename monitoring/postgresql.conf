# ────────────────────────────────────────────────────────────────
# PostgreSQL 17 — Configuration optimisée pour VPS 2 vCPU / 8 Go RAM
# ────────────────────────────────────────────────────────────────
# Basé sur pgtune.leopard.in.ua avec profil "web application"
# RAM totale VPS: 8GB | RAM allouée PostgreSQL: 2GB max
#
# AVERTISSEMENT: Monter ce fichier en lecture seule dans le container.
# Ne pas modifier en production sans tester en staging d'abord.
# ────────────────────────────────────────────────────────────────

# ── Connexions ──────────────────────────────────────────────────
# PgBouncer gère le pooling — PostgreSQL n'a besoin que de peu de connexions directes
max_connections = 30              # PgBouncer (20 pool) + admins (5) + marge (5)
superuser_reserved_connections = 3

# ── Mémoire ─────────────────────────────────────────────────────
shared_buffers = 512MB            # 25% de la RAM PostgreSQL (2GB allouée)
effective_cache_size = 1536MB     # 75% de la RAM PostgreSQL
work_mem = 16MB                   # Par opération de tri/hash — attention aux connexions !
maintenance_work_mem = 128MB      # Pour VACUUM, CREATE INDEX, ALTER TABLE
wal_buffers = 16MB                # Minimum recommandé pour les applications web

# ── Checkpoint & WAL ────────────────────────────────────────────
checkpoint_completion_target = 0.9
wal_compression = on              # Réduit la taille des WAL de 30–50%
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_timeout = 15min

# ── Query Planner ───────────────────────────────────────────────
random_page_cost = 1.1            # SSD — indique au planificateur que le disque est rapide
effective_io_concurrency = 200    # SSD — requêtes I/O parallèles
seq_page_cost = 1.0

# ── Parallélisme ────────────────────────────────────────────────
max_worker_processes = 2          # Correspondre aux vCPU du VPS
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

# ── Logging (minimal en prod pour les perfs) ────────────────────
log_min_duration_statement = 1000  # Logger les requêtes > 1 seconde seulement
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '
log_lock_waits = on               # Utile pour déboguer les deadlocks
log_temp_files = 0                # Logger l'usage de fichiers temporaires

# ── Auto-vacuum ─────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05   # Vacuum plus fréquent (5% vs 20% défaut)
autovacuum_analyze_scale_factor = 0.025

# ── Statistiques ────────────────────────────────────────────────
track_activities = on
track_counts = on
track_io_timing = on              # Pour EXPLAIN (ANALYZE, BUFFERS)
default_statistics_target = 100

# ── Locale & Encoding ───────────────────────────────────────────
client_encoding = UTF8
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
