global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nextjs-app'
    metrics_path: '/api/status'  # Ou un endpoint de télémétrie spécifique
    static_configs:
      - targets: ['web-a:3000', 'web-b:3000']
