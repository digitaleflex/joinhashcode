<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="HEF-030 Complexity : Trois courbes de croissance : la taille change tout.">
<title>HEF-030 — Complexity</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bc4c00"/><stop offset="1" stop-color="#ffa657"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#fff"/></marker>
<filter id="o" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/></filter>
</defs>
<rect width="800" height="300" rx="22" fill="url(#bg)"/>
<circle cx="740" cy="30" r="110" fill="#fff" opacity="0.08"/><circle cx="60" cy="300" r="90" fill="#fff" opacity="0.08"/>
<text x="36" y="52" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" opacity="0.8" letter-spacing="2">HEF-030</text>
<text x="36" y="88" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff">Complexity</text>
<text x="36" y="114" font-family="sans-serif" font-size="14" fill="#fff" opacity="0.9">Ce qui compte quand les données grossissent</text>
<g filter="url(#o)"><path d="M440 250 H760 M440 250 V130" stroke="#fff" stroke-width="3" fill="none"/><path d="M440 232 Q600 228 760 224" stroke="#aff5b4" stroke-width="5" fill="none"/><path d="M440 236 Q620 210 760 160" stroke="#ffd33d" stroke-width="5" fill="none"/><path d="M440 238 Q560 220 640 140 Q660 118 676 100" stroke="#ffb3a7" stroke-width="5" fill="none"/><text x="700" y="218" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">O(log n)</text><text x="700" y="156" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">O(n)</text><text x="680" y="98" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">O(n²)</text><text x="600" y="272" font-family="sans-serif" font-size="12" fill="#fff">taille des données →</text></g>
<text x="36" y="276" font-family="sans-serif" font-size="13" fill="#fff" opacity="0.92">Trois courbes de croissance : la taille change tout.</text>
