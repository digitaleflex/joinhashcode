# ────────────────────────────────────────────────────────────────
# Développement local uniquement.
# Démarre toute la stack (DB + app) en une commande.
#
#   docker compose --env-file .env.production up -d --wait
#
# En production, utilisez compose.app.yml et compose.db.yml
# séparément (fichiers optimisés pour le déploiement).
# ────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    container_name: hashcode-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: hashcode-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-adminer.rule=Host(`db.${APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-adminer.entrypoints=websecure"
      - "traefik.http.routers.hashcode-adminer.tls=true"
      - "traefik.http.routers.hashcode-adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-adminer.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.adminer-auth.basicauth.users=${ADMINER_AUTH}"
      - "traefik.http.routers.hashcode-adminer.middlewares=adminer-auth"

  web-a:
    image: ${HASHCODE_WEB_A_IMAGE:-hashcode-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hashcode-web-a
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-web.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-web.entrypoints=websecure"
      - "traefik.http.routers.hashcode-web.tls=true"
      - "traefik.http.routers.hashcode-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-web.loadbalancer.server.port=3000"

  web-b:
    image: ${HASHCODE_WEB_B_IMAGE:-hashcode-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hashcode-web-b
    restart: always
    ports: []
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-web.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-web.entrypoints=websecure"
      - "traefik.http.routers.hashcode-web.tls=true"
      - "traefik.http.routers.hashcode-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-web.loadbalancer.server.port=3000"

volumes:
  postgres_data:
    name: hashcode-postgres-data
  uploads_data:
    name: hashcode-uploads-data

networks:
  db-network:
    driver: bridge
    name: hashcode-db-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
  proxy:
    external: true
    name: proxy
