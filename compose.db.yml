# ────────────────────────────────────────────────────────────────
# Base de données PostgreSQL (stack indépendante de l'application)
# Démarrée une fois pour toutes — le pipeline de déploiement n'y
# touche jamais.
#
# Lancement :
#   docker compose -f compose.db.yml --env-file /chemin/vers/.env.production up -d
# ────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    container_name: hashcode-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: hashcode-adminer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-adminer.rule=Host(`db.${APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-adminer.entrypoints=websecure"
      - "traefik.http.routers.hashcode-adminer.tls=true"
      - "traefik.http.routers.hashcode-adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-adminer.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.adminer-auth.basicauth.users=${ADMINER_AUTH}"
      - "traefik.http.routers.hashcode-adminer.middlewares=adminer-auth"

volumes:
  postgres_data:
    name: hashcode-postgres-data

networks:
  db-network:
    driver: bridge
    name: hashcode-db-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
  proxy:
    external: true
    name: proxy
