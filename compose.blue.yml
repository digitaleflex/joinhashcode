# ────────────────────────────────────────────────────────────────
# Blue-Green Deploy Override
# Utilisé lors du déploiement pour démarrer le conteneur "blue"
# à côté de l'ancien "green", puis swap via Traefik.
#
# Usage :
#   docker compose -f compose.yaml -f compose.blue.yml up -d web-blue --wait
#   docker stop hashcode-web && docker rm hashcode-web
#   docker rename hashcode-web-blue hashcode-web
# ────────────────────────────────────────────────────────────────

services:
  web-blue:
    image: ${HASHCODE_BLUE_IMAGE}
    container_name: hashcode-web-blue
    restart: always
    ports: []  # Pas de binding host (évite conflit avec web)
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-web.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-web.entrypoints=websecure"
      - "traefik.http.routers.hashcode-web.tls=true"
      - "traefik.http.routers.hashcode-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-web.loadbalancer.server.port=3000"
